{% extends "lamane/base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block page_title %}{{ title }}{% endblock %}
{% block page_sub %}Devis & Estimations{% endblock %}

{% block content %}
<div style="display:flex;align-items:center;margin-bottom:22px;">
  <a href="{% url 'ui_devis_list' %}" class="btn btn-ghost btn-sm">
    <i class="fas fa-arrow-left"></i> Retour
  </a>
</div>

<div class="card animate-fade-up" style="max-width:700px;">
  <div class="card-header">
    <div class="card-title"><i class="fas fa-file-invoice" style="margin-right:8px;color:var(--gold);"></i> {{ title }}</div>
  </div>
  <form method="post">
    {% csrf_token %}
    <div style="display:flex;flex-direction:column;gap:16px;">
      <div>
        <label style="font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:6px;display:block;">Titre du devis *</label>
        <input type="text" name="titre" value="{{ obj.titre|default:'' }}" required
               class="filter-input" style="width:100%;" placeholder="Ex: Villa R+1 Almadies">
      </div>

      <div class="grid-2">
        <div>
          <label style="font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:6px;display:block;">Nom du client *</label>
          <input type="text" name="client_nom" value="{{ obj.client_nom|default:'' }}" required
                 class="filter-input" style="width:100%;" placeholder="Ex: M. Diallo">
        </div>
        <div>
          <label style="font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:6px;display:block;">Telephone</label>
          <input type="text" name="client_telephone" value="{{ obj.client_telephone|default:'' }}"
                 class="filter-input" style="width:100%;" placeholder="+221 77 000 00 00">
        </div>
      </div>

      <div class="grid-2">
        <div>
          <label style="font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:6px;display:block;">Email</label>
          <input type="email" name="client_email" value="{{ obj.client_email|default:'' }}"
                 class="filter-input" style="width:100%;" placeholder="client@email.com">
        </div>
        <div>
          <label style="font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:6px;display:block;">Localisation du chantier</label>
          <input type="text" name="localisation" value="{{ obj.localisation|default:'' }}"
                 class="filter-input" style="width:100%;" placeholder="Ex: Thies, Dakar...">
        </div>
      </div>

      <div>
        <label style="font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:6px;display:block;">Description</label>
        <textarea name="description" rows="3" class="filter-input" style="width:100%;resize:vertical;"
                  placeholder="Description du projet...">{{ obj.description|default:'' }}</textarea>
      </div>

      <div>
        <label style="font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:6px;display:block;">Marge (%)</label>
        <input type="number" name="marge_pourcentage" value="{{ obj.marge_pourcentage|default:'15' }}"
               step="0.5" min="0" max="100" class="filter-input" style="width:120px;">
        <span style="font-size:11px;color:var(--text-muted);margin-left:8px;">Appliquee sur le total metre</span>
      </div>

      <div style="border-top:1px solid var(--border-light);padding-top:16px;display:flex;gap:10px;">
        <button type="submit" class="btn btn-primary"><i class="fas fa-check"></i> {{ action }}</button>
        <a href="{% url 'ui_devis_list' %}" class="btn btn-ghost">Annuler</a>
      </div>
    </div>
  </form>
</div>
{% endblock %}
